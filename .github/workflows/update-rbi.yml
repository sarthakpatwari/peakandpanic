name: Update RBI data

on:
  schedule:
    - cron: '*/15 4-9 * * 1-5'     # every 15 minutes, 09:30-15:29 IST, Monday to Friday (MPC announcements are weekday mornings)
  workflow_dispatch: {}             # lets you press "Run workflow" by hand to test it

permissions:
  contents: write                   # lets the job save rbi-data.json back to the repository

concurrency:
  group: update-rbi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the RBI home page and update rbi-data.json
        run: node scripts/update-rbi.js
      - name: Save the file if it changed
        run: |
          if [ -n "$(git status --porcelain rbi-data.json)" ]; then
            git config user.name "peak-and-panic-bot"
            git config user.email "actions@users.noreply.github.com"
            git add rbi-data.json
            git commit -m "data: RBI update"
            git push
          else
            echo "rbi-data.json unchanged"
          fi